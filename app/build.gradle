// The release key lives in a gitignored signing/ folder and nowhere else. Without it a release
// builds unsigned, which installs nowhere: there is deliberately no fallback key.
def signingPropertiesFile = rootProject.file('signing/signing.properties')
def signingProperties = new Properties()
def hasSigningProperties = signingPropertiesFile.exists()
if (hasSigningProperties) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace = 'org.proninyaroslav.libretorrent'
    defaultConfig {
        applicationId 'com.wanderwildwood.honryu'
        minSdkVersion 24
        targetSdkVersion 35
        compileSdkVersion 37
        // Torrents 0.1.11, on LibreTorrent 4.1.1. versionCode = major * 1000000 + minor * 1000 + patch
        versionCode 1020
        versionName '0.1.20'
        vectorDrawables.useSupportLibrary = true

        ndk {
            // The Kompakt is arm64; x86_64 is for the emulator only (see debug, or pass
            // -PabiFilter=x86_64 to try a release build there).
            abiFilters project.findProperty('abiFilter') ?: 'arm64-v8a'
        }

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ['room.schemaLocation': "$projectDir/schemas".toString()]
            }
        }

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        if (hasSigningProperties) {
            release {
                storeFile rootProject.file('signing/signing.keystore')
                storePassword signingProperties.getProperty('STORE_PASSWORD')
                keyAlias signingProperties.getProperty('KEY_ALIAS')
                keyPassword signingProperties.getProperty('KEY_PASSWORD')
            }
        }
    }

    flavorDimensions = ["deploy"]

    productFlavors {
        base {
            dimension "deploy"
        }
        play {
            dimension "deploy"
        }
    }

    buildTypes {
        /* Enable or disable logging in build types */
        def SESSION_LOGGING = 'SESSION_LOGGING'

        release {
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            buildConfigField('boolean', SESSION_LOGGING, 'false')
            if (hasSigningProperties) {
                signingConfig = signingConfigs.release
            }
        }

        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-DEBUG'
            debuggable true
            ndk {
                abiFilters 'arm64-v8a', 'x86_64'
            }

            buildConfigField('boolean', SESSION_LOGGING, 'true')
            enableUnitTestCoverage = true
            enableAndroidTestCoverage = true
        }
    }

    // https://issuetracker.google.com/issues/402800800
    def isBuildingBundle = gradle.startParameter.taskNames.any { it.toLowerCase().contains("bundle") }
    splits {
        abi {
            // One APK: only arm64 ships, so there is nothing to split.
            enable = false
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk = true
        }
    }

    compileOptions {
        encoding = 'UTF-8'
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
    }

    buildFeatures {
        viewBinding = true
        dataBinding = true
        buildConfig = true
        resValues = true
        compose = true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
}

project.ext.versionCodes = ['armeabi-v7a': 1, 'arm64-v8a': 2, 'x86': 3, 'x86_64': 4]
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def filter = output.filters.find { it.filterType.name() == 'ABI' }
            def abiCode = filter ? (project.ext.versionCodes[filter.identifier] ?: 0) : 0
            output.versionCode.set(abiCode + (output.versionCode.get() ?: 0))
        }
    }
}

